name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -q

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/infra-collector'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com')
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString())
            core.info('OIDC sub=' + p.sub)
            core.info('OIDC repository=' + p.repository)
            core.info('OIDC repository_owner=' + p.repository_owner)
            core.info('OIDC ref=' + p.ref)
            core.info('OIDC aud=' + p.aud)
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::857190081936:role/collector18-github-deploy
          aws-region: us-west-2
      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --region us-west-2 \
            --instance-ids i-0620c1f128247f8e7 \
            --document-name AWS-RunShellScript \
            --comment "deploy collector18 ${GITHUB_SHA::7}" \
            --parameters 'commands=["set -e","sudo -u ubuntu git -C /home/ubuntu/collector18 fetch --quiet origin feat/infra-collector","sudo -u ubuntu git -C /home/ubuntu/collector18 reset --hard origin/feat/infra-collector","bash /home/ubuntu/collector18/infra/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "CommandId: $CMD_ID"
          aws ssm wait command-executed --region us-west-2 \
            --command-id "$CMD_ID" --instance-id i-0620c1f128247f8e7 || true
          aws ssm get-command-invocation --region us-west-2 \
            --command-id "$CMD_ID" --instance-id i-0620c1f128247f8e7 \
            --query "{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --region us-west-2 \
            --command-id "$CMD_ID" --instance-id i-0620c1f128247f8e7 \
            --query Status --output text)
          test "$STATUS" = "Success"